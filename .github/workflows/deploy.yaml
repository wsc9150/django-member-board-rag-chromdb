name: Deploy to EC2
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/django-member-board-rag-chromdb
            git pull --ff-only
            docker compose -f compose.prod.yaml up -d --build
            docker exec django-member-board-rag-chromdb-web-1 .venv/bin/python manage.py migrate --noinput
            docker exec django-member-board-rag-chromdb-web-1 .venv/bin/python manage.py collectstatic --noinput